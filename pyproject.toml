[project]
name = "google-chat-utils"
version = "0.7.3"
description = "A powerful and flexible toolkit for parsing Google AI Studio chats, representing them as objects, generating Markdown for RAG, and reconstructing Python code for the Gemini API."
requires-python = ">=3.9"
dependencies = [
    "google-generativeai",
    "pdoc",
    "httpx",
    "PyYAML",
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E402", "E501", "E701", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
